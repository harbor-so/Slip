# The dashboard and the HTTP/SSE API.
#
# More than one replica is safe. Nothing here elects a leader — the session runner
# and the automation scheduler each take a Postgres advisory lock, so replicas
# cooperate rather than duplicate.
#
# Sizing note that is not obvious: every open dashboard holds a DEDICATED Postgres
# connection for as long as its event stream is open, on top of the pool. A
# `max_connections` of 100 supports roughly 80 simultaneously open dashboards
# across the whole fleet, not per replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # SSE streams are long-lived by design. The default 30s gives an in-flight
      # stream time to close cleanly instead of being cut mid-frame on every
      # rolling update; raise it if your turns are long and your clients are
      # sensitive to a resnapshot.
      terminationGracePeriodSeconds: 60
      containers:
        - name: harbor
          image: ghcr.io/harbor-so/harbor:latest
          args: ["web"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: harbor-config
            - secretRef:
                name: harbor-secrets

          # Readiness DEPENDS on Postgres — a database blip should drain this pod
          # out of rotation, which is correct.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          # Liveness must NOT depend on Postgres, hence `?probe=live`. Point the
          # liveness probe at the readiness path and a database blip restarts
          # every replica simultaneously, turning a recoverable dependency failure
          # into a total outage plus a cold start. The query string is the whole
          # difference and it is easy to lose in a copy-paste.
          livenessProbe:
            httpGet:
              path: /api/health?probe=live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { memory: "1Gi" }

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # NOT read-only: `next start` writes to .next/cache.
            readOnlyRootFilesystem: false

# Note on the `docker` sandbox provider, deliberately not configured here.
#
# It needs the node's docker socket mounted into this pod, which is the same
# privilege as root on that node — for a pod that runs attacker-influenced text as
# instructions. If you accept that, run Harbor on a dedicated node pool and mount
# /var/run/docker.sock with a hostPath volume. Read docs/SECURITY.md first. The
# alternative, and the reason the ConfigMap defaults to a remote provider, is to
# let a vendor own the isolation boundary instead.
