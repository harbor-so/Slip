# A TEMPLATE. Do not apply it as-is, and do not commit a filled-in copy.
#
# It is excluded from kustomization.yaml deliberately, and named `.example` so
# that `kubectl apply -k` cannot create a Secret full of placeholder values that
# look configured and are not.
#
#   openssl rand -base64 32     # HARBOR_ENCRYPTION_KEY
#   openssl rand -base64 32     # AUTH_SECRET
#
# HARBOR_ENCRYPTION_KEY has no fallback and is never regenerated: a key invented
# at boot changes at the next boot, and every secret already stored becomes
# permanently unreadable with no error until somebody starts a session. Store it
# somewhere your database backup is NOT — a backup encrypted with a key kept in
# the same place is a backup with no encryption.
apiVersion: v1
kind: Secret
metadata:
  name: harbor-secrets
type: Opaque
stringData:
  # Must NOT be a transaction pooler. LISTEN/NOTIFY and advisory locks are session
  # state, and a transaction pooler breaks both silently. Use ?sslmode=verify-full,
  # not =require: postgres.js maps `require` to rejectUnauthorized=false, which
  # encrypts without verifying the server is who it claims to be.
  DATABASE_URL: "postgres://user:pass@postgres.example.com:5432/harbor?sslmode=verify-full"
  HARBOR_ENCRYPTION_KEY: "REPLACE-ME-openssl-rand-base64-32"
  AUTH_SECRET: "REPLACE-ME-openssl-rand-base64-32"
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  HARBOR_ALLOWED_GITHUB_LOGINS: ""
