services:
  postgres:
    image: postgres:17-alpine
    container_name: slip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: slip
      POSTGRES_PASSWORD: slip
      POSTGRES_DB: slip
    ports:
      - "5433:5432"
    volumes:
      - slip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slip -d slip"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  slip-pgdata:
