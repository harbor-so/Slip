services:
  postgres:
    image: postgres:17-alpine
    container_name: harbor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
      POSTGRES_DB: harbor
    ports:
      - "5433:5432"
    volumes:
      - harbor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  harbor-pgdata:
